[project]
name = "model-meta"
version = "0.1.0"
description = "TUI for defining Godot-compatible 3D model specs and validating an open modeling scene against them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2",
    "platformdirs>=4.10",
    "tomli-w>=1.0",
]

[project.scripts]
model-meta = "model_meta.app:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at the repository root (model_meta/),
# not under a src/ directory.
module-root = ""

[dependency-groups]
dev = [
    "textual-dev>=1.7",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
# Isolated so CI (and local packaging) can `uv sync --group build` without
# pulling the full dev toolchain. Not part of `dev`.
build = ["pyinstaller>=6.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "PL",  # pylint
]
ignore = [
    "PLR2004",  # magic-value-comparison
]
