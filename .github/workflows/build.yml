name: Build

# Builds a downloadable standalone binary for all four targets on every PR
# (canary artifacts a reviewer can QA) and every push to main (release-named
# artifacts Phase 3's release.yml will sign + publish). This workflow holds NO
# secrets: it runs on untrusted fork PRs, so nothing sensitive lives here. macOS
# binaries get an *ad-hoc* signature only (enough for Apple Silicon canaries to
# execute); Developer ID signing + notarization happen later in release.yml.

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]

# Cancel superseded PR pushes, but never cancel a main build (a rolling release
# must build from the exact tip that was merged).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Floor: read-only. No job here needs more (upload-artifact uses the Actions
# runtime token, not a `contents` scope).
permissions:
  contents: read

jobs:
  # Resolve the version string ONCE so all four legs embed an identical string
  # for a single commit (computing it inline per-leg risks four binaries with
  # four different strings). The per-leg _version.py *write* still happens in the
  # build job — the file must exist at freeze time.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      embedded: ${{ steps.compute.outputs.embedded }}
      slug: ${{ steps.compute.outputs.slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute version strings
        id: compute
        env:
          # PR events: github.sha is the ephemeral merge commit, so use the PR
          # head sha for the real code under review.
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          base="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            short="${PR_HEAD_SHA:0:7}"
            # SemVer: pre-release lowers precedence; +build metadata is the SHA's home.
            embedded="${base}-canary.pr${PR_NUMBER}+${short}"
            # Filename slug: only '-' (no '+'/'.', which break in URLs/tooling).
            slug="canary-pr${PR_NUMBER}-${short}"
          else
            short="${PUSH_SHA:0:7}"
            embedded="${base}-dev.${RUN_NUMBER}+${short}"
            slug="dev-${short}"
          fi
          echo "embedded=$embedded" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $embedded (slug: $slug)"

  build:
    needs: version
    strategy:
      # See every broken target instead of masking two behind the first failure.
      # (A partial matrix must never publish a release — enforced later by
      # release.yml requiring every target; canaries are allowed to be partial.)
      fail-fast: false
      matrix:
        include:
          # macOS is Apple Silicon only: the Intel runner (macos-13) is the last
          # of a deprecated image and its scarce pool queues for many minutes
          # (plan I8). Intel Mac users run the arm64 build under Rosetta 2.
          - target: macos-arm64
            os: macos-14
            ext: ""
          - target: linux-x86_64
            os: ubuntu-latest
            ext: ""
          - target: windows-x86_64
            os: windows-latest
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        # Identical ${VAR:0:7}/globbing/tar on Windows too.
        shell: bash
    env:
      EMBEDDED_VERSION: ${{ needs.version.outputs.embedded }}
      SLUG: ${{ needs.version.outputs.slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          # setup-uv's auto cache key already includes OS/arch/python, so the
          # four legs get distinct caches without a cache-suffix.
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install Python
        run: uv python install

      - name: Install build dependencies
        run: uv sync --frozen --no-dev --group build

      - name: Write _version.py
        run: |
          set -euo pipefail
          printf '__version__ = "%s"\n' "$EMBEDDED_VERSION" > model_meta/_version.py

      - name: Build (PyInstaller onedir)
        env:
          # Nudges toward a reproducible build; the unsigned artifact is the hash
          # anchor even though "mostly deterministic" is the realistic bar.
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          uv run --frozen --no-dev --group build pyinstaller --noconfirm model-meta.spec

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # On macOS the spec wraps the onedir tree in dist/model-meta.app (the
          # staplable container release.yml notarizes). Sign the bundle's nested
          # Mach-O files inner-to-outer, the launcher, then the bundle itself.
          # Ad-hoc (--sign -) is enough for canaries to *execute* on Apple Silicon
          # after clearing quarantine; Developer ID + hardened runtime + timestamp
          # + notarization are release.yml's job (Phase 3b). No --deep (deprecated).
          APP="dist/model-meta.app"
          find "$APP" -type f \( -name '*.so' -o -name '*.dylib' \) -print0 |
            while IFS= read -r -d '' f; do
              codesign --force --sign - "$f"
            done
          codesign --force --sign - "$APP/Contents/MacOS/model-meta"
          codesign --force --sign - "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Smoke test (does it launch?)
        run: |
          set -euo pipefail
          # Run the freshly built binary for THIS target (arm64 can't run on the
          # x86 leg). --check mounts headlessly, forcing app.tcss to parse and
          # the import graph to resolve — the one load-bearing gate. On macOS the
          # launcher lives inside the .app bundle; elsewhere it's the onedir tree.
          if [ "${{ runner.os }}" = "macOS" ]; then
            bin="dist/model-meta.app/Contents/MacOS/model-meta"
          else
            bin="dist/model-meta/model-meta${{ matrix.ext }}"
          fi
          "$bin" --version
          "$bin" --check

      - name: Package archive
        id: package
        run: |
          set -euo pipefail
          archive="model-meta-${SLUG}-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            file="${archive}.zip"
            # 7z is preinstalled on windows-latest; zips the onedir tree with a
            # top-level model-meta/ folder.
            (cd dist && 7z a -tzip "../${file}" model-meta >/dev/null)
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # tar the .app bundle (release.yml Developer ID signs, notarizes, and
            # staples it). tar preserves the bundle layout, the ad-hoc signature
            # inside each Mach-O, and — after 3b staples — the notarization ticket.
            file="${archive}.tar.gz"
            tar czf "${file}" -C dist model-meta.app
          else
            # tar.gz preserves the execute bit (and the ad-hoc signature, which
            # lives inside the Mach-O, not an xattr).
            file="${archive}.tar.gz"
            tar czf "${file}" -C dist model-meta
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      # PR: canary-named, kept 14 days so a longer review still has a live link.
      - name: Upload canary artifact
        id: upload_canary
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-meta-${{ env.SLUG }}-${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 0 # already a compressed archive

      # Surface a rendered, one-click download link on the run's Summary page so
      # a reviewer never has to expand logs. artifact-url needs a signed-in
      # GitHub session (Actions artifacts have no public URL) and 404s once the
      # 14-day retention lapses. Each matrix leg contributes its own line, so all
      # targets land together on the run Summary.
      - name: Link canary download in run summary
        if: github.event_name == 'pull_request'
        env:
          TARGET: ${{ matrix.target }}
          ART_URL: ${{ steps.upload_canary.outputs.artifact-url }}
        run: |
          {
            echo "### ⬇️ Canary download — \`$TARGET\`"
            echo ""
            echo "[Download the \`$TARGET\` canary]($ART_URL) — sign in to GitHub, then unzip"
            echo "the wrapper to get the \`.tar.gz\`/\`.zip\`. Link dies after 14 days; re-run to refresh."
          } >> "$GITHUB_STEP_SUMMARY"

      # Push to main: stable release-named, short retention — release.yml
      # (Phase 3) fetches these by run-id to sign and publish.
      - name: Upload release artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
